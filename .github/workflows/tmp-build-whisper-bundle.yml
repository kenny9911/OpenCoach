name: Temporary Whisper Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-whisper-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential curl ca-certificates

      - name: Build whisper.cpp v1.9.1 CLI
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper.cpp/build --config Release -j 2

      - name: Download multilingual Whisper models and speaker encoder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle base-bundle
          curl --fail --location --retry 5 --retry-all-errors \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin \
            --output bundle/ggml-small-q5_1.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  bundle/ggml-small-q5_1.bin" | sha256sum -c -

          curl --fail --location --retry 5 --retry-all-errors \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin \
            --output base-bundle/ggml-base-q5_1.bin

          python -m pip install --disable-pip-version-check --quiet "huggingface_hub<1.0"
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="speechbrain/spkrec-ecapa-voxceleb",
              local_dir="bundle/spkrec-ecapa-voxceleb",
              local_dir_use_symlinks=False,
              allow_patterns=["*.ckpt", "*.yaml", "*.py", "*.txt", "*.json"],
          )
          PY

          cp /tmp/whisper.cpp/build/bin/whisper-cli bundle/
          cp /tmp/whisper.cpp/build/bin/whisper-cli base-bundle/
          cp /tmp/whisper.cpp/LICENSE bundle/LICENSE-whisper.cpp
          cp /tmp/whisper.cpp/LICENSE base-bundle/LICENSE-whisper.cpp
          chmod +x bundle/whisper-cli base-bundle/whisper-cli
          ldd bundle/whisper-cli || true
          find bundle -type f -print0 | sort -z | xargs -0 sha256sum > bundle/SHA256SUMS
          find base-bundle -type f -print0 | sort -z | xargs -0 sha256sum > base-bundle/SHA256SUMS

      - name: Upload high-accuracy transcription bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-linux
          path: bundle/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload fast transcription bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-linux
          path: base-bundle/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
